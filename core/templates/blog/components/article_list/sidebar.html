
<div class="col-lg-4 sidebar">

    <div class="widgets-container">

    <!-- Blog Author Widget 2 -->
    <div class="blog-author-widget-2 widget-item">

        <h3 class="widget-title">Categories</h3>

        <div class="row g-2">

            
            {% for category in categories %}
                
                <div class="col-6">
                    <a
                    href="{% url 'category' category_slug=category.slug %}"
                    class="category-item d-flex align-items-center justify-content-between text-decoration-none"
                    style="
                        padding: 14px 15px;
                        border: 1px solid #eee;
                        border-radius: 6px;
                        color: #212529;
                        background: #fff;
                    "
                    >
                    <span>{{ category.name|title }}</span>
                    <i class="bi bi-chevron-right" style="font-size: 11px;"></i>
                    </a>
                </div>

            {% endfor %}

        </div>

    </div>

        <!-- Search Widget -->
        <div class="search-widget widget-item">

            <h3 class="widget-title">Search</h3>

            <form
                action="{% url 'search_results' %}"
                method="GET"
                id="searchForm"
                style="
                    display: flex;
                    align-items: center;
                    width: 100%;
                    height: 48px;
                    border: 1px solid #e2e2e2;
                    border-radius: 8px;
                    background: #fff;
                    overflow: hidden;
                    transition: border-color 0.2s ease, box-shadow 0.2s ease;
                "
            >
                <input
                    type="search"
                    id="searchInput"
                    name="q"
                    placeholder="Search articles..."
                    style="
                        flex: 1;
                        width: 100%;
                        height: 100%;
                        padding: 0 14px;
                        border: 0;
                        outline: 0;
                        background: transparent;
                        color: #212529;
                        font-size: 14px;
                        box-shadow: none;
                    "
                >

                <button
                    type="submit"
                    title="Search"
                    style="
                        width: 48px;
                        height: 48px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-shrink: 0;
                        border: 0;
                        border-left: 1px solid #e2e2e2;
                        background: #fff;
                        color: #212529;
                        cursor: pointer;
                        transition: all 0.2s ease;
                    "
                >
                    <i
                        class="bi bi-search"
                        style="
                            font-size: 16px;
                        "
                    ></i>
                </button>
            </form>

        </div>
        <!-- /Search Widget -->


    <!-- Recent Posts Widget -->
    <div class="recent-posts-widget widget-item">

        <h3 class="widget-title">Recent Posts</h3>

        
        {% for post in recent_posts %}
            
            <div class="post-item">
            <img src="{{ post.image.url }}" alt="" class="flex-shrink-0">
            <div>
                <h4><a href="blog-details.html">{{ post.title }}</a></h4>
                <time datetime="2020-01-01">{{ post.published_at|date:"M d, Y" }}</time>
            </div>
            </div><!-- End recent post item-->
            
        {% endfor %}

    </div><!--/Recent Posts Widget -->

    <!-- Tags Widget -->
    <div class="tags-widget widget-item">

        <h3 class="widget-title">Tags</h3>
        <ul>
            
            {% for tag in tags %}
                
                <li><a href="{% url 'tag' tag_slug=tag.slug %}">{{ tag.name }}</a></li>
                
            {% endfor %}
        </ul>

    </div><!--/Tags Widget -->

    </div>

</div>
